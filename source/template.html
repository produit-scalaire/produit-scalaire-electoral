<meta name="claude:viewport-fit-sides" content="cover">
<style>

  --bg:#f6f7fa; --card:#ffffff; --ink:#0f1633; --muted:#565f7e; --line:#dde1ec;
  --accent:#1b3fa6; --accent-ink:#ffffff; --accent-soft:#e7ecfa; --bleu:#1b3fa6; --blanc:#ffffff; --rouge:#e1000f; --warn:#b45309; --good:#1f7a4d;
  --display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1120; --card:#161b30; --ink:#e9ecf7; --muted:#9ba4c4; --line:#2a3150;
  --accent:#8ea2ff; --accent-ink:#0d1120; --accent-soft:#232b52; --bleu:#4a66e0; --blanc:#e9ecf7; --rouge:#ef4150; --warn:#f0a35a; --good:#5fd19a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1120; --card:#161b30; --ink:#e9ecf7; --muted:#9ba4c4; --line:#2a3150;
  --accent:#8ea2ff; --accent-ink:#0d1120; --accent-soft:#232b52; --bleu:#4a66e0; --blanc:#e9ecf7; --rouge:#ef4150; --warn:#f0a35a; --good:#5fd19a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(2.1rem,6.5vw,3.4rem);line-height:1;letter-spacing:-.02em}

a{color:var(--accent)}

@media (max-width:620px){.anim-intro .label{display:none}.anim-intro .btn{width:100%}.anim-intro{padding-bottom:10px;border-bottom:1px solid var(--line);box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}}
@media (max-width:620px){.tabs{overflow:visible}.tabs button{flex:1 1 0;padding:10px 6px;font-size:14px;white-space:normal}.tabs .long{display:none}.tabs .short{display:inline}
 .brand{font-size:1rem}.brand .dl{font-size:13px;text-align:right;max-width:7.5rem}
 .bar{grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 3.2rem}.frame{border-radius:0}
 .shell.wide{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)) + 4px)}}
.options.guess{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.guess-card{border-left:4px solid var(--accent,currentColor)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 3rem;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cq{grid-column:1/-1;font-weight:700;font-size:14.5px}.cc{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--muted);grid-column:1/-1}
.cbar{position:relative;height:12px;background:var(--line);border-radius:6px;overflow:hidden;align-self:center}.cbar .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--muted)}
.cbar i{position:absolute;top:0;bottom:0}.cbar i.pos{background:var(--good)}.cbar i.neg{background:#c98500}
.cv{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}.csum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:2px solid var(--ink);padding-top:10px}
#calc-p{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-left:6px;max-width:100%}

<script id="data" type="application/json">__DATA__</script>
<script>
const app=document.getElementById("app");
/* LIEN DU FORMULAIRE DE CORRECTIONS : coller ici l'adresse du Google Form (laisser "" tant qu'il n'existe pas). */
const FORM_URL="";
function suiteHTML(){return `<div class="card">
    <h3>Et maintenant ?</h3>
    <p>Si cet exercice vous a fait réfléchir, partagez-le. Parlez-en autour d'un repas, avec quelqu'un qui ne pense pas comme vous. Servez-vous-en comme point de départ, pas comme conclusion.</p>
    <p>Une position mal placée, une source fausse, une question mal posée ? Toute correction sera lue et étudiée${FORM_URL?` : <a href="${esc(FORM_URL)}" target="_blank" rel="noopener">proposer une correction</a>`:" (formulaire bientôt disponible)"}. Indiquez la référence de la question, visible sous chacune d'elles.</p>
  </div>`;}
const WEIGHTS=[["Pas important",0],["Un peu",1],["Important",2],["Essentiel",3]];
const PRIOR=2; // weight of a neutral prior: a party with few known positions is pulled towards 0
let DATA=null,S=null;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function agree(q,u,p){if(q.ordered&&q.options.length>2)return 1-2*Math.abs(u-p)/(q.options.length-1);return u===p?1:-1;}

function scores(subset){
  const out=DATA.parties.map(p=>({p,num:0,den:0,n:0,same:0}));
  for(const a of S.answers){if(a.choice===null||a.w===0)continue;const q=DATA.byId[a.id];if(subset&&!subset(q))continue;
    out.forEach(o=>{const pos=q.positions[o.p.id];if(pos===undefined)return;o.num+=a.w*agree(q,a.choice,pos);o.den+=a.w;o.n++;if(pos===a.choice)o.same++;});}
  out.forEach(o=>{o.s=o.den?o.num/(o.den+PRIOR):null;o.pct=o.den?Math.round((o.num/o.den+1)*50):null;});
  return out.sort((a,b)=>(b.s??-9)-(a.s??-9));
}

/* adaptive pick: the unanswered question that best separates the parties currently closest to you, balanced across themes */
function pickNext(){
  const done=new Set(S.answers.map(a=>a.id));const left=DATA.questions.filter(q=>!done.has(q.id));if(!left.length)return null;
  if(Math.random()<0.2)return left[Math.floor(Math.random()*left.length)];
  const ranked=scores().filter(o=>o.s!==null);const top=(ranked.length>=2?ranked.slice(0,4):DATA.parties.map(p=>({p}))).map(o=>o.p.id);
  const themeCount={};S.answers.forEach(a=>{const t=DATA.byId[a.id].theme;themeCount[t]=(themeCount[t]||0)+1;});
  const cand=[];
  for(const q of left){const pos=top.map(id=>q.positions[id]).filter(v=>v!==undefined);
    const distinct=new Set(pos).size;const known=Object.keys(q.positions).length;
    const split=distinct>1?distinct+pos.length/4:0;            // does it separate the leading parties?
    const spread=new Set(Object.values(q.positions)).size>1?1:0; // does it separate anyone at all?
    const score=split*2+spread+known/10+q.reliability/3-(themeCount[q.theme]||0)*1.2;
    cand.push([q,score]);}
  // tirage pondéré : les questions utiles sortent plus souvent, mais jamais toujours les mêmes
  const m=Math.max(...cand.map(c=>c[1]));const ws=cand.map(c=>Math.exp((c[1]-m)/1.5));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let k=0;k<cand.length;k++){r-=ws[k];if(r<=0)return cand[k][0];}
  return cand[cand.length-1][0];
}

function start(n){S={target:Math.min(n,DATA.questions.length),answers:[],cur:null,choice:null,w:null,guess:undefined};S.cur=pickNext();renderQuestion();}
function finish(){S.cur=null;if(S.guess===undefined)renderGuess();else renderResults();}
function renderGuess(){
  app.innerHTML=`
  <p class="eyebrow">Avant votre résultat</p>
  <h2>Selon vous, quel parti est le plus proche de vous ?</h2>
  <p class="lede">Notez votre intuition, puis comparez-la à vos réponses.</p>
  <div class="card">
    <div class="options guess" role="group" aria-label="Votre pronostic">
      ${DATA.parties.map(p=>`<button class="opt" data-g="${p.id}"><span>${esc(p.name)}</span></button>`).join("")}
      <button class="opt" data-g=""><span>Je ne sais pas</span></button>
    </div>
  </div>
  <button class="btn ghost" id="back" style="align-self:flex-start">← Retour</button>`;
  document.getElementById("back").onclick=back;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.guess=b.dataset.g||null;renderResults();});
}
function guessHTML(all){
  if(S.guess===undefined)return "";
  const ranked=all.filter(o=>o.s!==null),best=ranked[0];
  if(S.guess===null)return `<div class="card guess-card"><h3>Votre pronostic</h3><p>Vous ne saviez pas. Vos réponses, elles, penchent vers <strong>${esc(best.p.name)}</strong>. Est-ce que ça vous surprend ?</p></div>`;
  const g=all.find(o=>o.p.id===S.guess),rank=ranked.indexOf(g)+1;
  let msg;
  if(g.s===null)msg=`Vos réponses ne touchent aucun sujet où la position de ce parti est connue. Continuez pour le savoir.`;
  else if(rank===1)msg=`Vos réponses vous donnent raison : c'est bien le parti le plus proche. Reste à regarder les thèmes où il ne l'est pas.`;
  else msg=`Sur vos réponses, il arrive <strong>${rank}<sup>e</sup></strong> sur ${ranked.length}, à ${g.pct} %, contre ${best.pct} % pour <strong>${esc(best.p.name)}</strong>. Qu'est-ce qui, dans vos choix, vous éloigne de lui ?`;
  return `<div class="card guess-card"><h3>Votre pronostic : ${esc(g.p.name)}</h3><p>${msg}</p></div>`;
}

function renderStart(){
  const n=DATA.questions.length;
  app.innerHTML=`
  <p class="eyebrow">Simulateur de l'Assemblée nationale · ${n} votes et décisions réels</p>
  <h1>Personne ne pense exactement comme vous.</h1>
  <p class="lede">Prenez la place d'un député. On vous met face aux vrais votes, sans dire qui a voté quoi. Vous choisissez, vous dites ce qui compte pour vous, et on regarde quel parti a voté le plus comme vous.</p>
  <div class="card notice">
    <h3>Toutes les opinions ne trouvent pas leur place</h3>
    <p>Les réponses proposées viennent de votes et de choix réels. Une idée qui n'a jamais été soumise au vote ne peut donc pas apparaître, même si beaucoup de gens la partagent. Par exemple, on peut penser que l'âge de départ à la retraite devrait dépendre du métier, parce que certains métiers usent bien plus le corps que d'autres. Des dispositifs partiels existent (le compte de prévention de la pénibilité, les départs anticipés de certains métiers de la fonction publique), mais un âge de départ fixé métier par métier n'a jamais été voté en tant que tel.</p>
    <p><strong>Si votre position n'y figure pas, choisissez la plus proche ou passez la question.</strong></p>
  </div>
  <div class="card">
    <h3>Combien de temps avez-vous ?</h3>
    <div class="lengths">
      ${[[10,"5 minutes","10 questions"],[30,"20 minutes","30 questions"],[n,"Sans limite",`toutes les questions, ${n} aujourd’hui`]].filter(([k])=>k<=n).map(([k,a,b])=>`<button class="length" data-n="${k}"><strong>${a}</strong><span>${b}</span></button>`).join("")}
    </div>
    __DOWNLOAD2__
  </div>
  ${methodHTML()}`;
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>start(+b.dataset.n));
}

function methodHTML(){return `<div class="card teaser"><p>Pourquoi pas simplement gauche ou droite ?</p><div class="row"><button class="btn" data-go="dimensions">Revoir l'introduction</button><button class="btn ghost" data-go="apropos">Intention et limites</button></div></div>`;}

function renderQuestion(){
  const q=S.cur;if(!q)return finish();
  const i=S.answers.length;
  app.innerHTML=`
  ${S.target>=DATA.questions.length?"":`<div class="progress" aria-hidden="true"><i style="width:${Math.round(100*i/S.target)}%"></i></div>`}
  <div class="meta"><span>${S.edit!==undefined?"Modifier votre réponse":`Question ${i+1}${S.target>=DATA.questions.length?"":` sur ${S.target}`}`}</span><span>${esc(DATA.themes[q.theme])} · ${esc(q.date)}</span></div>
  <div class="card">
    <p class="situation">${esc(q.situation)}</p>
    <div class="askrow"><p class="ask">${esc(q.question)}</p>${q.contexte?`<button class="info" id="info" aria-expanded="${!!S.info}" aria-controls="ctx" title="Contexte">i</button>`:""}</div>
    ${q.contexte?`<p class="ctx" id="ctx" ${S.info?"":"hidden"}>${esc(q.contexte)}</p>`:""}
    <div class="options" role="group" aria-label="Réponses possibles">
      ${q.options.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${S.choice===k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div><p class="label" style="margin-bottom:6px">Ce sujet compte pour vous :</p>
    <div class="weights" role="group" aria-label="Importance">${WEIGHTS.map(([l,w])=>`<button data-w="${w}" aria-pressed="${S.w===w}">${l}</button>`).join("")}</div></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev">← ${S.edit!==undefined?"Annuler":"Précédente"}</button>
      <button class="btn ghost" id="skip">Passer cette question</button>
      <button class="btn primary" id="ok" ${S.choice===null||S.w===null?"disabled":""}>Valider</button>
    </div>
  </div>
  ${(i>=3||S.target>=DATA.questions.length&&i>=1)&&S.edit===undefined?`<button class="btn ghost" id="early" style="align-self:center">Voir mon résultat maintenant</button>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.choice=+b.dataset.k;renderQuestion();});
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{S.w=+b.dataset.w;renderQuestion();});
  const ib=document.getElementById("info");if(ib)ib.onclick=()=>{S.info=!S.info;ib.setAttribute("aria-expanded",S.info);document.getElementById("ctx").hidden=!S.info;};
  document.getElementById("ok").onclick=()=>commit(S.choice);
  document.getElementById("skip").onclick=()=>commit(null);
  document.getElementById("prev").onclick=back;
  const e=document.getElementById("early");if(e)e.onclick=finish;
}
function back(){
  if(S.edit!==undefined){S.edit=undefined;S.choice=null;S.w=null;return renderResults();}
  if(!S.answers.length){S.choice=null;S.w=null;return renderStart();}
  const a=S.answers.pop();S.cur=DATA.byId[a.id];S.choice=a.choice;S.w=a.choice===null?null:a.w;scrollTo({top:0});renderQuestion();}
function editAnswer(k){const a=S.answers[k];S.edit=k;S.cur=DATA.byId[a.id];S.choice=a.choice;S.w=a.choice===null?null:a.w;scrollTo({top:0});renderQuestion();}
function commit(choice){
  if(S.edit!==undefined){S.answers[S.edit]={id:S.cur.id,choice,w:choice===null?0:S.w};S.edit=undefined;S.choice=null;S.w=null;return renderResults();}
  S.answers.push({id:S.cur.id,choice,w:choice===null?0:S.w});S.choice=null;S.w=null;S.info=false;
  S.cur=S.answers.length>=S.target?null:pickNext();scrollTo({top:0});renderQuestion();}

function confidence(){const w=S.answers.reduce((s,a)=>s+a.w,0);
  if(w<10)return ["low","Fiabilité faible","Répondez à plus de questions pour un résultat solide."];
  if(w<22)return ["mid","Fiabilité moyenne","Le classement peut encore bouger."];
  return ["high","Fiabilité bonne","Le classement est stable sur cette banque de questions."];}

function calcRows(pid){
  const p=DATA.parties.find(x=>x.id===pid);let num=0,den=0;
  const rows=S.answers.filter(a=>a.choice!==null&&a.w>0&&DATA.byId[a.id].positions[pid]!==undefined).map(a=>{
    const q=DATA.byId[a.id],pos=q.positions[pid],v=a.w*agree(q,a.choice,pos);num+=v;den+=a.w;
    return `<div class="crow"><div class="cq">${esc(q.question)}</div>
      <div class="cc"><span>Vous : <b>${esc(q.options[a.choice])}</b> · importance ${a.w}</span><span>${esc(p.name)} : <b>${esc(q.options[pos])}</b></span></div>
      <div class="cbar"><span class="mid"></span><i class="${v>=0?"pos":"neg"}" style="width:${Math.abs(v)/3*50}%;${v>=0?"left:50%":"right:50%"}"></i></div>
      <span class="cv">${v>0?"+":""}${Math.round(v*10)/10}</span></div>`;}).join("");
  const pct=den?Math.round((num/den+1)*50):null;
  document.getElementById("calc").innerHTML=rows+`<div class="csum"><span>Somme : <b>${num>0?"+":""}${Math.round(num*10)/10}</b> sur ${den} possibles</span><span>Alignement : <b>${pct===null?"–":pct+" %"}</b></span></div>`;
}
function renderResults(){
  const all=scores(),answered=S.answers.filter(a=>a.choice!==null);
  if(!answered.length){app.innerHTML=`<h2>Aucune réponse pour l'instant</h2><button class="btn primary" id="again">Recommencer</button>`;document.getElementById("again").onclick=renderStart;return;}
  const [cl,ct,cd]=confidence();const best=all[0];
  const themes=[...new Set(answered.map(a=>DATA.byId[a.id].theme))];
  const left=DATA.questions.length-S.answers.length;
  app.innerHTML=`
  <p class="eyebrow">Votre résultat · ${answered.length} réponse${answered.length>1?"s":""}</p>
  <h1>${best.s!==null&&best.s>0?`Le plus proche de vous&nbsp;: ${esc(best.p.name)}`:"Aucun parti ne se détache"}</h1>
  <p><span class="pill ${cl}">${ct}</span> <span class="label">${cd}</span></p>
  ${guessHTML(all)}
  <div class="card">
    <h3>Alignement global</h3>
    <p class="label">100 % : mêmes choix sur toutes les questions communes. 50 % : neutre. 0 % : choix opposés.</p>
    <div class="bars">${all.map((o,k)=>`<div class="bar ${k===0&&o.s>0?"top":""}"><span class="name">${esc(o.p.name)}</span>
      <span class="track"><i style="width:${o.pct??0}%"></i></span><span class="val">${o.pct===null?"–":o.pct+" %"}</span>
      <small>${o.n?`même choix sur ${o.same} des ${o.n} question${o.n>1?"s":""} où sa position est connue`:"position inconnue sur vos réponses"}</small></div>`).join("")}</div>
  </div>
  <div class="card">
    <h3>Le calcul, avec vos réponses</h3>
    <p class="label">Pour chaque question, votre importance multipliée par l'accord (+1 même choix, −1 choix opposé). La somme, rapportée au total possible, donne le pourcentage.</p>
    <label class="label">Comparer avec <select id="calc-p">${all.filter(o=>o.n).map(o=>`<option value="${o.p.id}">${esc(o.p.name)}</option>`).join("")}</select></label>
    <div id="calc"></div>
  </div>
  <div class="card">
    <h3>Par thème</h3>
    <p class="label">On peut être proche d'un parti sur le logement et d'un autre sur la santé. Un thème avec moins de 3 réponses reste indicatif.</p>
    <div class="themes">${themes.map(t=>{const r=scores(q=>q.theme===t).filter(o=>o.s!==null);const n=answered.filter(a=>DATA.byId[a.id].theme===t).length;
      const tops=r.length?r.filter(o=>Math.abs(o.s-r[0].s)<1e-9):[];
      return `<div class="theme"><span>${esc(DATA.themes[t])} · ${n} réponse${n>1?"s":""}${n<3?" · indicatif":""}</span>
        <b>${!tops.length||tops[0].s<=0?"Pas de parti proche":tops.length>3?`${tops.length} partis à égalité`:tops.map(o=>esc(o.p.name)).join(", ")}</b></div>`;}).join("")}</div>
  </div>
  <div class="card">
    <h3>Question par question</h3>
    ${answered.map(a=>{const q=DATA.byId[a.id];const k=S.answers.indexOf(a);const same=DATA.parties.filter(p=>q.positions[p.id]===a.choice).map(p=>p.name);
      return `<details><summary>${esc(q.question)}</summary><div class="detail">
        <p class="you">Votre choix : <strong>${esc(q.options[a.choice])}</strong> <button class="btn ghost" data-edit="${k}">Changer</button></p>
        <p>${same.length?`Même choix que : <strong>${esc(same.join(", "))}</strong>`:"Aucun parti placé n'a fait ce choix."}</p>
        ${q.contexte?`<p>${esc(q.contexte)}</p>`:""}<p>${esc(q.actor)}</p>${q.nuance?`<p class="label">${esc(q.nuance)}</p>`:""}
        <p class="label">Réf. : ${esc(q.id)}</p><p><span class="dots" title="Fiabilité du placement des partis">${"●".repeat(q.reliability)}${"○".repeat(3-q.reliability)}</span> ${q.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(" · ")}</p>
      </div></details>`;}).join("")}
  </div>
  ${suiteHTML()}
  <div class="row">
    ${left?`<button class="btn primary" id="more">Continuer (${left} question${left>1?"s":""} de plus)</button>`:""}
    <button class="btn" id="again">Recommencer</button>
  </div>
  ${methodHTML()}`;
  const m=document.getElementById("more");if(m)m.onclick=()=>{S.target=DATA.questions.length;S.cur=pickNext();renderQuestion();};
  document.getElementById("again").onclick=renderStart;
  const cs=document.getElementById("calc-p");if(cs){cs.onchange=()=>calcRows(cs.value);calcRows(cs.value);}
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editAnswer(+b.dataset.edit));
  scrollTo({top:0});
}


const TABS=["dimensions","questionnaire","apropos"];
function showTab(t,push){if(!TABS.includes(t))t="dimensions";
  TABS.forEach(x=>{document.getElementById("tab-"+x).hidden=x!==t;document.getElementById("t-"+x).setAttribute("aria-selected",x===t);});
  document.getElementById("shell").classList.toggle("wide",t==="dimensions");
  if(push&&location.hash!=="#"+t){try{history.replaceState(null,"","#"+t);}catch(e){}}
  scrollTo({top:0});if(t==="dimensions")sizeAnim();}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-go]");if(!b)return;showTab(b.dataset.tab||b.dataset.go,true);});
addEventListener("hashchange",()=>showTab(location.hash.slice(1)));
let animRO=null;
function sizeAnim(){const f=document.getElementById("anim");try{const d=f.contentDocument;if(!d||!d.body)return;
  const fit=()=>{f.style.height=Math.max(640,d.documentElement.scrollHeight)+"px";};fit();
  if(!animRO&&window.ResizeObserver){animRO=new ResizeObserver(fit);animRO.observe(d.body);}}catch(e){}}
document.getElementById("anim").addEventListener("load",()=>{animRO=null;sizeAnim();});
try{const d=JSON.parse(document.getElementById("data").textContent);
  d.byId=Object.fromEntries(d.questions.map(q=>[q.id,q]));DATA=d;document.getElementById("foot-version").textContent=`${d.questions.length} questions · mise à jour le ${d.version.split("-").reverse().join("/")}`;renderStart();showTab(location.hash.slice(1));
}catch(e){app.innerHTML=`<h2>Les questions n'ont pas pu être chargées</h2><p class="err">Le fichier semble incomplet. Téléchargez-le à nouveau.</p>`;}
</script>
